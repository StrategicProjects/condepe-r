on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, after the Saturday publication cycle of the Observatory.
    - cron: "0 12 * * 0"
  workflow_dispatch:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        # macOS left out: the package is pure R and GitHub's macOS arm64
        # runners were unavailable (jobs cancelled after 15 min in the queue).
        config:
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # The ADR 0006 acceptance check, from a runner outside Brazil.
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
      - name: Recife population from the live data
        run: |
          s <- condepe::condepe_series("sidra_populacao_estimada",
            "Populacao residente estimada", code = "2611606", years = 2025)
          stopifnot(nrow(s) == 1, s$valor > 1e6)
          print(s[c("cd_municipio_ibge", "ano", "valor")])
        shell: Rscript {0}
