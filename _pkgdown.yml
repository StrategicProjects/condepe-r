url: https://strategicprojects.github.io/condepe-r/
lang: pt

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#0c2856"

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Primeiros passos
      href: articles/condepe.html
    reference:
      text: Funções
      href: reference/index.html
    articles:
      text: Guias
      menu:
      - text: Exemplos
        href: articles/exemplos.html
      - text: Mapas
        href: articles/mapas.html
      - text: "---"
      - text: Fontes do Observatório
        href: articles/fontes.html
    news:
      text: Novidades
      href: news/index.html

home:
  title: "condepe: dados abertos do Observatório de Pernambuco no R"
  description: >
    Acesso aos dados abertos do Observatório de Pernambuco (Condepe/Fidem):
    séries municipais de população, economia, finanças públicas, trabalho,
    educação, saúde, segurança, transporte e meio ambiente, todas no mesmo
    formato longo.

reference:
- title: Descobrir
  desc: O que o Observatório publica.
  contents:
  - condepe_catalog
  - condepe_indicators
  - condepe_localities
- title: Obter os dados
  contents:
  - condepe_series
  - condepe_data
- title: Citar
  desc: A fonte original primeiro, o Observatório como organizador.
  contents:
  - condepe_cite
- title: Mapas e regiões
  desc: Malha municipal da Condepe/Fidem ou do IBGE e regionalizações do estado.
  contents:
  - condepe_geometry
  - condepe_add_geometry
  - condepe_regions
  - condepe_roads
  - condepe_hydrography
  - condepe_layer
- title: Cache e opções
  contents:
  - condepe_cache_dir
  - condepe-package

articles:
- title: Guias
  navbar: ~
  contents:
  - condepe
  - exemplos
  - mapas
  - fontes

news:
  releases: []
